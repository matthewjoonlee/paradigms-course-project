{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Worndly{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="{% url 'worndly:home' %}">Worndly</a>
            <nav class="site-nav">
                <a href="{% url 'worndly:profile_list' %}">Profiles</a>
                <a href="{% url 'worndly:profile_create' %}">Create Profile</a>
                <a href="{% url 'worndly:dashboard' %}">Dashboard</a>
                <a href="/admin/">Admin</a>
            </nav>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
